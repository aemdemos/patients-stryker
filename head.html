<meta
  http-equiv="Content-Security-Policy"
  content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none'; frame-src 'self' https:; require-trusted-types-for 'script';"
  move-to-http-header="true"
/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script nonce="aem" src="/scripts/aem.js" type="module"></script>
<script nonce="aem" src="/scripts/scripts.js" type="module"></script>
<link rel="stylesheet" href="/styles/styles.css"/>
<!-- Preload the primary brand faces (one per family: body / headings / display)
     so they download in the eager phase and are usually ready before font-display:
     swap would otherwise paint the fallback — keeps the swap shift near-zero while
     guaranteeing the brand font renders. Capped at 3 to avoid LCP bandwidth
     contention; the bold weights are declared in styles.css and fetch on demand.
     crossorigin is required on font preloads even when same-origin. -->
<link rel="preload" href="/fonts/humanist-slab-712.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="preload" href="/fonts/urw-egyptienne-light.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="preload" href="/fonts/futura-lt-book.woff2" as="font" type="font/woff2" crossorigin/>
