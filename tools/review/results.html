<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Standard pages review: results</title>
  <link rel="stylesheet" href="./results.css">
  <script type="module" src="./results.js"></script>
</head>
<body>
  <header class="rs-bar">
    <h1>Standard pages review: results</h1>
    <span class="rs-updated" aria-live="polite">Loading the reviews…</span>
    <label class="rs-check"><input type="checkbox" class="rs-hide-tests" checked> Hide test entries</label>
    <button type="button" class="rs-btn rs-refresh">Refresh</button>
    <a class="rs-btn" href="./index.html">Open the review tool</a>
  </header>
  <main class="rs-main">
    <section class="rs-section" id="progress"><h2>Progress</h2><div class="rs-body"></div></section>
    <section class="rs-section" id="designs"><h2>Design decisions</h2><div class="rs-body"></div></section>
    <section class="rs-section" id="comments"><h2>Comments</h2><div class="rs-body"></div></section>
    <section class="rs-section" id="notes"><h2>QA notes</h2><div class="rs-body"></div></section>
  </main>
  <div class="rs-blocked" hidden>The review results open on the review preview only.</div>
</body>
</html>
