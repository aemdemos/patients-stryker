<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Standard pages review: status of every page</title>
  <link rel="stylesheet" href="./results.css">
  <link rel="stylesheet" href="./status.css">
  <script type="module" src="./status.js"></script>
</head>
<body>
  <header class="rs-bar">
    <h1>Review status of every page</h1>
    <span class="rs-updated" aria-live="polite">Loading…</span>
    <button type="button" class="rs-btn st-refresh">Refresh</button>
    <a class="rs-btn" href="./index.html">Open the review tool</a>
    <a class="rs-btn st-results" href="./results.html" hidden>Results</a>
  </header>
  <main class="rs-main">
    <section class="rs-section">
      <div class="st-tiles" role="group" aria-label="Pages per state (click to filter)"></div>
      <div class="st-meter" aria-hidden="true"></div>
      <div class="st-filters">
        <label>Search <input type="search" class="st-search" placeholder="Title or path"></label>
        <label>Template <select class="st-template"><option value="">All</option></select></label>
        <label>Business unit <select class="st-unit"><option value="">All</option></select></label>
        <label>State <select class="st-state"><option value="">All</option></select></label>
        <label>Order <select class="st-order">
          <option value="waiting">What waits for me first</option>
          <option value="recent">Latest activity first</option>
          <option value="title">Title</option>
        </select></label>
        <label class="st-check"><input type="checkbox" class="st-new"> Only new since my last visit</label>
      </div>
      <p class="st-count rs-muted"></p>
      <div class="st-table"></div>
      <button type="button" class="rs-btn st-more" hidden>Show more</button>
    </section>
  </main>
  <div class="rs-blocked" hidden>The review status opens on the review preview only.</div>
</body>
</html>
