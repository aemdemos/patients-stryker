<!DOCTYPE html>
<html>

<head>
  <meta
    http-equiv="Content-Security-Policy"
    content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
    move-to-http-header="true"
  >
  <title>404 | Stryker</title>
  <script nonce="aem" type="text/javascript">
    window.isErrorPage = true;
    window.errorCode = '404';
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="404 | Stryker">
  <script nonce="aem" type="module">
    // the backend serves 404.html without bulk metadata: apply the /metadata.json rules for
    // the requested path first, so the section's header, footer and `site` are used
    import applyBulkMetadata from '/scripts/bulk-metadata.js';

    await applyBulkMetadata();
    await import('/scripts/scripts.js');
  </script>
  <script nonce="aem" type="module">
    import { sampleRUM } from '/scripts/aem.js';
    sampleRUM('404', { source: document.referrer });
  </script>
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    /* source 404 (patients.stryker.com): 10px below the header, smaller headings below
       480px (mapped to the 600px breakpoint), 30px from the text to the HOME button */
    main.error .default-content-wrapper {
      padding-top: var(--space-block-s);
    }

    main.error h2 {
      font-size: var(--heading-font-size-l);
    }

    main.error h3 {
      margin-bottom: var(--space-block-l);
      font-size: var(--heading-font-size-m);
    }

    @media (width >= 600px) {
      main.error h2 {
        font-size: var(--heading-font-size-xl);
      }

      main.error h3 {
        margin-bottom: var(--space-section);
        font-size: var(--heading-font-size-l);
      }
    }
  </style>
  <link rel="stylesheet" href="/styles/lazy-styles.css">
</head>

<body>
  <header></header>
  <main class="error">
    <div>
      <h2><u>We couldn't find the page you're looking for.</u></h2>
      <h3>Please try again later or review other pages on our site for the information you're seeking.</h3>
      <p><strong><a href="/">Home</a></strong></p>
    </div>
  </main>
  <footer></footer>
</body>

</html>
